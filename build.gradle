
plugins {
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.0.11.RELEASE'
	id 'java'
}

bootJar {
	zip64(true)
	println 'is Zip64 in bootJar task enable? ' + isZip64()
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	destinationDirectory = file(project.relativeProjectPath('target'))
	//archiveName('app.jar')
}

tasks.named("bootJar") {
	project.file('target/app.jar').delete()
	mainClass = 'backcore.BackCoreApplication'
}


group = 'backcore'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	//implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.liquibase:liquibase-core'
	implementation group: 'commons-fileupload', name: 'commons-fileupload', version: '1.4'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-redis', version: '3.4.2'
	implementation group: 'jakarta.persistence', name: 'jakarta.persistence-api', version: '3.1.0'

	//compileOnly group: 'javax', name: 'javaee-api', version: '8.0'
	compileOnly group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.1.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	//testImplementation 'org.springframework.security:spring-security-test'
}

task stage(type: Copy, dependsOn: [clean,build]) {
	from jar.archivePath
	into project.rootDir
	rename {
		'app.jar'
	}
}
stage.mustRunAfter(clean)

clean {
	project.file('app.jar').delete()
}
jar {
	zip64(true)
	println 'is Zip64 in jar task enable? ' + isZip64()
	from('src/main/resources')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	manifest {
		attributes(
				'Main-Class': 'backcore.BackCoreApplication'
		)
	}
	from {
		configurations.runtimeClasspath.collect {it.isDirectory() ? it : zipTree(it)}
	}
}

